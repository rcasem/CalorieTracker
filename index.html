<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CalorieTracker Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #F2F2F7; --card: #FFFFFF; --text: #000000; 
            --primary: #34C759; --danger: #FF3B30; --border: #E5E5EA;
            --accent: #007AFF;
        }
        [data-theme="dark"] { 
            --bg: #000000; --card: #1C1C1E; --text: #FFFFFF; 
            --border: #38383A; --primary: #30D158;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            background: var(--bg); color: var(--text); 
            margin: 0; padding: 20px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Container for iOS Notch */
        .safe-area { padding-top: env(safe-area-inset-top); }

        .card { 
            background: var(--card); padding: 20px; border-radius: 24px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.04); margin-bottom: 20px; 
            border: 1px solid var(--border);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin: 0; }

        .progress-label { font-size: 14px; color: #8E8E93; font-weight: 600; margin-bottom: 8px; display: block; }
        .progress-container { width: 100%; background: var(--border); border-radius: 12px; height: 12px; overflow: hidden; }
        #progressBar { height: 100%; width: 0%; background: var(--primary); transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); }

        .input-group { margin-bottom: 15px; }
        label { font-size: 13px; font-weight: 600; margin-left: 5px; color: #8E8E93; text-transform: uppercase; }
        
        input { 
            width: 100%; padding: 16px; margin-top: 5px; border: none; 
            border-radius: 16px; font-size: 17px; box-sizing: border-box; 
            background: var(--bg); color: var(--text); outline: none;
            transition: ring 0.2s;
        }
        input:focus { box-shadow: 0 0 0 2px var(--accent); }

        button { 
            width: 100%; background: var(--primary); color: white; border: none; 
            padding: 18px; border-radius: 18px; font-weight: 700; font-size: 17px; 
            margin-top: 10px; transition: transform 0.1s, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(0.97); opacity: 0.9; }
        .btn-ghost { background: transparent; color: var(--accent); font-size: 14px; padding: 10px; }
        .btn-export { background: var(--accent); }

        .history-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 14px 0; border-bottom: 0.5px solid var(--border); 
        }
        .history-item:last-child { border-bottom: none; }
        
        #chartContainer { height: 220px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="safe-area">
        <div class="header">
            <h1>Activity</h1>
            <button onclick="toggleTheme()" class="btn-ghost" style="width:auto">Dark Mode</button>
        </div>

        <div class="card">
            <span class="progress-label">DAILY CALORIES</span>
            <div style="display:flex; justify-content:space-between; align-items: flex-end; margin-bottom: 10px;">
                <span id="calsConsumed" style="font-size: 32px; font-weight: 700;">0</span>
                <span id="calsGoalText" style="color: #8E8E93; font-weight: 500; padding-bottom: 4px;">/ 2000 kcal</span>
            </div>
            <div class="progress-container"><div id="progressBar"></div></div>
            <p id="remainingText" style="font-size: 14px; margin-top: 12px; color: #8E8E93;"></p>
        </div>

        <div class="card">
            <span class="progress-label">WEEKLY TREND</span>
            <div id="chartContainer"><canvas id="myChart"></canvas></div>
        </div>

        <div class="card">
            <div class="input-group">
                <label>Food Entry</label>
                <input type="text" id="foodName" placeholder="What did you eat?">
            </div>
            <div class="input-group">
                <label>Calories</label>
                <input type="number" id="calories" placeholder="0" inputmode="numeric">
            </div>
            <button onclick="addEntry()">Add Meal</button>
        </div>

        <div class="card">
            <span class="progress-label">SETTINGS & DATA</span>
            <div class="input-group" style="margin-top:10px;">
                <label>Set Daily Goal</label>
                <input type="number" id="goalInput" onchange="updateGoal(this.value)">
            </div>
            <button class="btn-export" onclick="exportToCSV()">Export Data (.csv)</button>
            <button class="btn-ghost" style="color:var(--danger); margin-top:20px;" onclick="clearLocalStorage()">Reset All History</button>
        </div>
    </div>

    <script>
        // ... (Include the JavaScript from the previous response here) ...
        // Note: The JS logic remains the same, but the UI IDs match the new styled elements.
        
        let logs = JSON.parse(localStorage.getItem('calData')) || [];
        let dailyGoal = localStorage.getItem('calGoal') || 2000;
        let myChart;

        if(localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        
        function toggleTheme() {
            let current = document.documentElement.getAttribute('data-theme');
            let target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            renderChart();
        }

        function updateGoal(val) {
            dailyGoal = val;
            localStorage.setItem('calGoal', val);
            updateUI();
        }

        function addEntry() {
            const name = document.getElementById('foodName').value || "Meal";
            const cals = parseInt(document.getElementById('calories').value);
            if (!cals) return;
            logs.push({ name, cals, date: new Date().toISOString().split('T')[0] });
            localStorage.setItem('calData', JSON.stringify(logs));
            document.getElementById('foodName').value = '';
            document.getElementById('calories').value = '';
            updateUI();
        }

        function updateUI() {
            const today = new Date().toISOString().split('T')[0];
            const todayTotal = logs.filter(l => l.date === today).reduce((s, l) => s + l.cals, 0);
            const percent = Math.min((todayTotal / dailyGoal) * 100, 100);
            
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressBar').style.background = todayTotal > dailyGoal ? 'var(--danger)' : 'var(--primary)';
            document.getElementById('calsConsumed').innerText = todayTotal;
            document.getElementById('calsGoalText').innerText = `/ ${dailyGoal} kcal`;
            document.getElementById('remainingText').innerText = todayTotal > dailyGoal 
                ? `You are ${todayTotal - dailyGoal} kcal over your goal.` 
                : `You can eat ${dailyGoal - todayTotal} more kcal today.`;
            
            document.getElementById('goalInput').value = dailyGoal;
            renderChart();
        }

        function renderChart() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const ctx = document.getElementById('myChart').getContext('2d');
            const last7Days = [...Array(7)].map((_, i) => {
                const d = new Date(); d.setDate(d.getDate() - i);
                return d.toISOString().split('T')[0];
            }).reverse();
            const totals = last7Days.map(d => logs.filter(l => l.date === d).reduce((s, l) => s + l.cals, 0));

            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: last7Days.map(d => {
                        const date = new Date(d);
                        return date.toLocaleDateString('en-US', { weekday: 'short' });
                    }),
                    datasets: [{
                        data: totals,
                        backgroundColor: totals.map(v => v > dailyGoal ? '#FF3B30' : '#34C759'),
                        borderRadius: 8,
                        barThickness: 25
                    }]
                },
                options: { 
                    maintainAspectRatio: false,
                    scales: { 
                        x: { grid: { display: false }, ticks: { color: isDark ? '#8E8E93' : '#8E8E93', font: { weight: '600' } } },
                        y: { display: false }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function exportToCSV() {
            let csv = "Date,Food,Calories\n" + logs.map(r => `${r.date},${r.name},${r.cals}`).join("\n");
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'nutrition_data.csv');
            a.click();
        }

        function clearLocalStorage() { if(confirm("Clear all data?")) { localStorage.clear(); location.reload(); } }
        updateUI();
    </script>
</body>
</html>
