l<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CalorieTracker Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { 
            --bg: #F2F2F7; --card: #FFFFFF; --text: #000000; 
            --primary: #34C759; --danger: #FF3B30; --border: #E5E5EA; --accent: #007AFF;
            --pill: rgba(0, 0, 0, 0.05);
        }
        [data-theme="dark"] { 
            --bg: #000000; --card: #1C1C1E; --text: #FFFFFF; --border: #2C2C2E;
            --pill: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text); 
            margin: 0; padding: 0; transition: background 0.3s;
        }

        .sticky-header {
            position: sticky; top: 0; z-index: 10;
            background: var(--bg); padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .date-stepper {
            display: flex; align-items: center; background: var(--pill);
            padding: 5px; border-radius: 12px; gap: 5px;
        }
        .step-btn {
            background: var(--card); border: none; color: var(--text);
            width: 32px; height: 32px; border-radius: 8px; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container { padding: 0 16px 100px 16px; }

        .card { 
            background: var(--card); padding: 20px; border-radius: 28px; 
            margin-bottom: 16px; border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.02);
        }

        /* FIXED: Alignment for Target Box */
        .summary-header { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .target-column { 
            display: flex; flex-direction: column; align-items: flex-end; 
            text-align: right; min-width: 140px; 
        }

        .target-box {
            background: var(--pill); padding: 10px 12px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid transparent; width: 100%; box-sizing: border-box;
            transition: 0.2s; margin-top: 5px;
        }
        .target-box:focus-within { border-color: var(--accent); background: var(--card); }
        .target-input {
            background: transparent; border: none; color: var(--text);
            font-size: 19px; font-weight: 800; width: 100%; text-align: center; outline: none;
        }

        .progress-ring-container { margin-top: 25px; }
        .bar-bg { background: var(--border); height: 12px; border-radius: 6px; overflow: hidden; }
        #barFill { height: 100%; background: var(--primary); width: 0%; transition: 0.8s cubic-bezier(0.1, 0.8, 0.2, 1); }

        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        input, select { 
            background: var(--pill); border: none; padding: 16px; 
            border-radius: 16px; color: var(--text); font-size: 16px; width: 100%;
            outline: none; -webkit-appearance: none;
        }
        .btn-main { 
            background: var(--primary); color: white; border: none; 
            padding: 18px; border-radius: 18px; font-weight: 700; font-size: 16px;
            width: 100%; margin-top: 5px;
        }

        .meal-header { 
            font-size: 12px; font-weight: 700; color: #8E8E93; 
            text-transform: uppercase; margin: 20px 0 8px 8px;
        }
        .history-row {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card); padding: 14px 18px; border-radius: 18px;
            margin-bottom: 8px; border: 1px solid var(--border);
        }
        .row-name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row-right { display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
        .row-cals { font-weight: 800; color: var(--text); }
        .del-x { color: var(--danger); font-size: 18px; font-weight: bold; background: none; border: none; }
    </style>
</head>
<body>

    <div class="sticky-header">
        <div class="date-stepper">
            <button class="step-btn" onclick="changeDate(-1)">⇠</button>
            <span id="displayDate" style="font-weight: 800; padding: 0 10px; min-width: 60px; text-align: center;">Today</span>
            <button class="step-btn" onclick="changeDate(1)">⇢</button>
        </div>
        <button onclick="toggleTheme()" style="background:none; border:none; color:var(--accent); font-weight:700;">Theme</button>
    </div>

    <div class="container">
        <div class="card">
            <div class="summary-header">
                <div>
                    <div style="font-size: 11px; font-weight: 700; color: #8E8E93; letter-spacing: 0.5px;">CONSUMED</div>
                    <div style="font-size: 44px; font-weight: 900; line-height: 1.1;"><span id="totalCals">0</span><span style="font-size:14px; color:#8E8E93; margin-left:4px; font-weight:700;">kcal</span></div>
                </div>
                <div class="target-column">
                    <div style="font-size: 11px; font-weight: 700; color: #8E8E93; letter-spacing: 0.5px;">DAILY TARGET</div>
                    <div class="target-box">
                        <input type="number" id="goalInput" class="target-input" oninput="updateGoal(this.value)">
                        <span style="font-weight: 800; font-size: 11px; color:#8E8E93; margin-left:5px;">KCAL</span>
                    </div>
                </div>
            </div>
            <div class="progress-ring-container">
                <div class="bar-bg"><div id="barFill"></div></div>
            </div>
        </div>

        <div class="card">
            <div class="input-group">
                <select id="mealType" style="flex: 1.3;">
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                    <option value="Snack">Snack</option>
                </select>
                <input type="number" id="calories" placeholder="kcal" inputmode="numeric" style="flex: 1;">
            </div>
            <input type="text" id="foodName" placeholder="Whats your meal today?">
            <button id="addBtn" class="btn-main" onclick="addEntry()">Log Entry</button>
        </div>

        <div id="historyContainer"></div>
    </div>

    <script>
        let logs = JSON.parse(localStorage.getItem('calData')) || [];
        let dailyGoal = parseInt(localStorage.getItem('calGoal')) || 2000;
        let viewDate = new Date();
        let editId = null;

        if(localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

        function toggleTheme() {
            let t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
        }

        function changeDate(n) { viewDate.setDate(viewDate.getDate() + n); updateUI(); }

        function updateGoal(v) { if(v > 0) { dailyGoal = parseInt(v); localStorage.setItem('calGoal', dailyGoal); updateUI(false); } }

        function addEntry() {
            const type = document.getElementById('mealType').value;
            const name = document.getElementById('foodName').value || "Meal";
            const cals = parseInt(document.getElementById('calories').value);
            const dStr = viewDate.toISOString().split('T')[0];

            if(!cals) return;

            if(editId) {
                const i = logs.findIndex(l => l.id === editId);
                logs[i] = { ...logs[i], type, name, cals };
                editId = null;
                document.getElementById('addBtn').innerText = "Log Entry";
                document.getElementById('addBtn').style.background = "var(--primary)";
            } else {
                logs.push({ id: Date.now(), type, name, cals, date: dStr });
            }

            localStorage.setItem('calData', JSON.stringify(logs));
            updateUI();
            document.getElementById('foodName').value = '';
            document.getElementById('calories').value = '';
        }

        function editEntry(id) {
            const l = logs.find(x => x.id === id);
            editId = id;
            document.getElementById('mealType').value = l.type;
            document.getElementById('foodName').value = l.name;
            document.getElementById('calories').value = l.cals;
            document.getElementById('addBtn').innerText = "Update";
            document.getElementById('addBtn').style.background = "var(--accent)";
            window.scrollTo({top: 100, behavior: 'smooth'});
        }

        function deleteEntry(id) {
            logs = logs.filter(x => x.id !== id);
            localStorage.setItem('calData', JSON.stringify(logs));
            updateUI();
        }

        function updateUI(refreshList = true) {
            const dStr = viewDate.toISOString().split('T')[0];
            const isToday = dStr === new Date().toISOString().split('T')[0];
            
            document.getElementById('displayDate').innerText = isToday ? "Today" : viewDate.toLocaleDateString(undefined, {month:'short', day:'numeric'});
            
            const dayLogs = logs.filter(l => l.date === dStr);
            const total = dayLogs.reduce((s, l) => s + l.cals, 0);

            document.getElementById('totalCals').innerText = total;
            document.getElementById('goalInput').value = dailyGoal;
            
            const perc = Math.min((total / dailyGoal) * 100, 100);
            const bar = document.getElementById('barFill');
            bar.style.width = perc + '%';
            bar.style.background = total > dailyGoal ? 'var(--danger)' : 'var(--primary)';

            if(!refreshList) return;
            const cont = document.getElementById('historyContainer');
            cont.innerHTML = '';

            ["Breakfast", "Lunch", "Dinner", "Snack"].forEach(cat => {
                const group = dayLogs.filter(l => l.type === cat);
                if(group.length > 0) {
                    let html = `<div class="meal-header">${cat}</div>`;
                    group.forEach(item => {
                        html += `
                            <div class="history-row">
                                <div style="flex:1; min-width:0;" onclick="editEntry(${item.id})">
                                    <div class="row-name">${item.name}</div>
                                </div>
                                <div class="row-right">
                                    <span class="row-cals">${item.cals}</span>
                                    <button class="del-x" onclick="deleteEntry(${item.id})">×</button>
                                </div>
                            </div>`;
                    });
                    cont.innerHTML += html;
                }
            });
            if(dayLogs.length === 0) cont.innerHTML = `<div style="text-align:center; color:#8E8E93; margin-top:40px; font-size:14px;">No logs for this date.</div>`;
        }

        updateUI();
    </script>
</body>
</html>
